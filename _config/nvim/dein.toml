[[plugins]] # dein
repo = 'Shougo/dein.vim'

[[plugins]]
repo = 'Shougo/deoplete.nvim'
on_i = 1
hook_add = '''
  " <TAB> で補完を選択
  inoremap <silent><expr> <Tab> pumvisible() ? "\<C-n>" : deoplete#mappings#manual_complete()
'''
hook_source = '''
  let g:deoplete#enable_at_startup = 1
'''

[[plugins]] # Toml
repo  = 'cespare/vim-toml'
on_ft = 'toml'

[[plugins]]
repo = 'scrooloose/syntastic.git'

[[plugins]]
repo = 'w0rp/ale'

[[plugins]] # Theme
repo = 'junegunn/seoul256.vim'

[[plugins]] # Theme
repo = 'mhartington/oceanic-next'

[[plugins]] # Theme
repo = 'joshdick/onedark.vim'

[[plugins]] # Theme
repo = 'folke/tokyonight.nvim'

[[plugins]] # for Ruby
repo = 'tpope/vim-endwise'

[[plugins]] # indent
repo = 'Yggdroot/indentLine'

[[plugins]] # EditorConfig
repo = 'editorconfig/editorconfig-vim'

[[plugins]]
repo = 'Shougo/neomru.vim'
on_path = '.*'

[[plugins]]
repo = 'Shougo/denite.nvim'
depends = 'neomru.vim'
'''
hook_post_source = '''
call denite#custom#var('file_rec', 'command',
\ ['pt', '--follow', '--nocolor', '--nogroup', '--hidden', '-g', ''])
call denite#custom#var('grep', 'command',
\ ['pt', '--nogroup', '--nocolor', '--smart-case', '--hidden'])
call denite#custom#var('grep', 'default_opts', [])
call denite#custom#var('grep', 'recursive_opts', [])
'''

[[plugins]] # for resizing vim window
repo = 'simeji/winresizer'

# for JavaScript
[[plugins]]
repo = 'prettier/vim-prettier'
build    = 'npm install'
on_ft    = ['javascript', 'typescript', 'json']
hook_source = '''
  autocmd BufWritePre *.js,*.ts,*.json PrettierAsync
'''

[[plugins]]
repo = 'pangloss/vim-javascript'
on_ft = ['javascript', 'javascript.jsx']

[[plugins]] # Theme
repo = 'catppuccin/nvim'
name = 'catppuccin'
hook_add = '''
lua << EOF
  require("catppuccin").setup({
      flavour = "macchiato", -- ここで mocha フレーバーを指定します (他に latte, frappe, macchiato があります)
      transparent_background = true,

      -- その他、各種UIプラグイン（LualineやTelescopeなど）の統合設定をここに追加できます
      integrations = {
          nvimtree = true,
          telescope = true,
          mason = true,
          -- lualine = true,
      }
  })
EOF
'''

[[plugins]]
repo = 'xiyaowong/transparent.nvim'
hook_add = '''
lua << EOF
  require("transparent").setup({
    -- 基本的なエディタの背景（Normal, LineNr, StatusLineなど）はデフォルトで透過されます。
    -- ここには「追加で透過したい」ハイライトグループを指定します。
    extra_groups = {
      "NormalFloat",     -- MasonやLazy、LspInfoなどのフローティングウィンドウパネル
      "FloatBorder",     -- フローティングウィンドウの境界線
      "NvimTreeNormal",  -- NvimTreeの背景
      "NeoTreeNormal",   -- Neo-treeの背景
      "NeoTreeNormalNC",
      "TelescopeNormal", -- Telescopeの背景
      "TelescopeBorder", -- Telescopeの境界線
    },

    -- 逆に、透過させたくないグループがある場合はここに指定します
    exclude_groups = {},
  })

  -- 【応用設定】
  -- lualineやbufferlineなど、動的にハイライト（アイコンの色など）を生成するUIプラグインの
  -- 背景も完全に透過させたい場合は、以下の `clear_prefix` を有効に（コメントアウトを解除）してください。
  -- require('transparent').clear_prefix('lualine')
  -- require('transparent').clear_prefix('BufferLine')
  -- require('transparent').clear_prefix('NeoTree')
EOF
'''
